<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Project Emancipate - Map Editor / 地图编辑器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; font-family: "Microsoft YaHei", sans-serif; }
    #editor-canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    #toolbar { position: fixed; top: 10px; left: 10px; z-index: 100; background: rgba(20,20,30,0.95); border: 1px solid #c9a962; border-radius: 4px; padding: 8px; display: flex; flex-direction: column; gap: 4px; min-width: 180px; }
    .tool-btn { padding: 8px 12px; background: transparent; border: 1px solid transparent; color: #ccc; cursor: pointer; text-align: left; font-size: 13px; border-radius: 2px; transition: all 0.15s; }
    .tool-btn:hover { background: rgba(201,169,98,0.2); border-color: #c9a962; color: #ffd700; }
    .tool-btn.active { background: rgba(201,169,98,0.3); border-color: #ffd700; color: #ffd700; }
    .tool-group { border-top: 1px solid rgba(201,169,98,0.2); margin-top: 4px; padding-top: 4px; }
    .tool-label { font-size: 11px; color: #888; padding: 0 4px; margin-bottom: 2px; }
    #status-bar { position: fixed; bottom: 10px; left: 10px; right: 10px; z-index: 100; background: rgba(20,20,30,0.95); border: 1px solid #c9a962; border-radius: 4px; padding: 6px 12px; font-size: 12px; color: #aaa; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; }
    .status-item { display: flex; align-items: center; gap: 8px; }
    .status-value { color: #ffd700; font-family: monospace; }
    #palette { position: fixed; top: 10px; right: 10px; z-index: 100; background: rgba(20,20,30,0.95); border: 1px solid #c9a962; border-radius: 4px; padding: 8px; max-height: 80vh; overflow-y: auto; min-width: 200px; display: none; }
    #palette.visible { display: block; }
    .palette-item { padding: 6px 10px; cursor: pointer; border-radius: 2px; font-size: 12px; color: #ccc; transition: background 0.1s; }
    .palette-item:hover { background: rgba(201,169,98,0.2); color: #ffd700; }
    .palette-item.selected { background: rgba(201,169,98,0.3); color: #ffd700; }
    .palette-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid rgba(201,169,98,0.2); }
    .palette-title { color: #c9a962; font-weight: bold; font-size: 13px; }
    .palette-close { background: none; border: none; color: #888; cursor: pointer; font-size: 16px; line-height: 1; }
    @media (max-width: 768px) {
      #toolbar { left: 5px; top: 5px; min-width: 140px; }
      .tool-btn { padding: 6px 8px; font-size: 12px; }
      #palette { right: 5px; left: 5px; top: auto; bottom: 60px; max-height: 50vh; min-width: auto; }
    }
  </style>
</head>
<body>
  <canvas id="editor-canvas"></canvas>

  <div id="toolbar">
    <div class="tool-label">工具 (V/T/B/H/N/S/W/R/E)</div>
    <button class="tool-btn active" data-tool="select" title="选择 (V)">🖱️ 选择</button>
    <button class="tool-btn" data-tool="terrain" title="地形笔刷 (T)">🏔️ 地形</button>
    <button class="tool-btn" data-tool="biome" title="生物群系笔刷 (B)">🌲 群系</button>
    <div class="tool-group">
      <div class="tool-label">对象</div>
      <button class="tool-btn" data-tool="building" title="放置建筑 (H)">🏠 建筑</button>
      <button class="tool-btn" data-tool="npc" title="放置NPC (N)">👤 NPC</button>
      <button class="tool-btn" data-tool="spawner" title="放置生成器 (S)">👹 生成器</button>
      <button class="tool-btn" data-tool="waypoint" title="放置路点 (W)">📍 路点</button>
      <button class="tool-btn" data-tool="region" title="绘制区域 (R)">🗺️ 区域</button>
    </div>
    <div class="tool-group">
      <div class="tool-label">编辑</div>
      <button class="tool-btn" data-tool="eraser" title="橡皮擦 (E)">🧽 擦除</button>
    </div>
    <div class="tool-group">
      <button class="tool-btn" id="btn-playtest" title="试玩 (P)">▶ 试玩</button>
      <button class="tool-btn" id="btn-export" title="导出地图">💾 导出</button>
      <button class="tool-btn" id="btn-import" title="导入地图">📁 导入</button>
    </div>
  </div>

  <div id="palette">
    <div class="palette-header">
      <span class="palette-title" id="palette-title">预设</span>
      <button class="palette-close" id="palette-close">×</button>
    </div>
    <div id="palette-content"></div>
  </div>

  <div id="status-bar">
    <div class="status-item">模式: <span class="status-value" id="status-mode">编辑</span></div>
    <div class="status-item">工具: <span class="status-value" id="status-tool">选择</span></div>
    <div class="status-item">笔刷: <span class="status-value" id="status-brush">32px</span></div>
    <div class="status-item">坐标: <span class="status-value" id="status-pos">0, 0</span></div>
    <div class="status-item">缩放: <span class="status-value" id="status-zoom">100%</span></div>
    <div class="status-item">对象: <span class="status-value" id="status-count">建筑: 0 | NPC: 0 | 生成器: 0 | 路点: 0</span></div>
  </div>

  <script type="module">
    import { createEditor, EDITOR_TOOLS, EDITOR_MODES } from './js/editor/editor.js';
    import { createRenderer } from './js/engine/renderer.js';
    import { generateTerrain } from './js/engine/terrain.js';
    import { createLiberationSystem } from './js/gameplay/liberation.js';
    import { setGlobalSeed, globalPRNG } from './js/prng.js';

    const canvas = document.getElementById('editor-canvas');
    const toolbar = document.getElementById('toolbar');
    const palette = document.getElementById('palette');
    const paletteContent = document.getElementById('palette-content');
    const paletteTitle = document.getElementById('palette-title');

    // Initialize renderer first
    const renderer = createRenderer(canvas);
    window.renderer = renderer;

    // Generate base terrain
    const seed = Date.now() ^ 0xEMANCIPATE;
    setGlobalSeed(seed);
    const terrain = generateTerrain({ seed, width: 1000, height: 1000 });
    window.terrain = terrain;

    // Liberation system
    const liberation = createLiberationSystem({ seed });
    window.liberation = liberation;

    // Create editor
    const editor = createEditor({
      canvas,
      renderer,
      terrainSystem: terrain,
      liberationSystem: liberation,
      onPlaytest: (data) => {
        // Save playtest data and redirect to game
        localStorage.setItem('legendeditor.playtest', JSON.stringify(data));
        window.open('index.html?playtest=1', '_blank');
      }
    });
    window.editor = editor;

    // Tool buttons
    const toolBtns = toolbar.querySelectorAll('[data-tool]');
    function setActiveTool(tool) {
      editor.setTool(tool);
      toolBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tool === tool);
      });
      document.getElementById('status-tool').textContent = getToolName(tool);
      updatePalette(tool);
    }

    toolBtns.forEach(btn => {
      btn.addEventListener('click', () => setActiveTool(btn.dataset.tool));
    });

    // Special buttons
    document.getElementById('btn-playtest').addEventListener('click', () => {
      editor.togglePlaytest();
    });

    document.getElementById('btn-export').addEventListener('click', () => {
      editor.exportToFile();
    });

    document.getElementById('btn-import').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (file) editor.importFromFile(file).then(() => updateStatus());
      };
      input.click();
    });

    document.getElementById('palette-close').addEventListener('click', () => {
      palette.classList.remove('visible');
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      editor.handleKeyDown(e);
      // Update status after shortcuts
      setTimeout(updateStatus, 0);
    });

    window.addEventListener('keyup', (e) => {
      // editor.handleKeyUp(e);
    });

    // Mouse events
    canvas.addEventListener('mousedown', (e) => editor.handleMouseDown(e));
    canvas.addEventListener('mousemove', (e) => {
      editor.handleMouseMove(e);
      updateMousePos(e);
    });
    canvas.addEventListener('mouseup', (e) => editor.handleMouseUp(e));
    canvas.addEventListener('wheel', (e) => editor.handleWheel(e), { passive: false });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    function updateMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      const cam = editor.getCamera();
      const x = Math.round((e.clientX - rect.left) / cam.zoom + cam.x - canvas.width / 2 / cam.zoom);
      const y = Math.round((e.clientY - rect.top) / cam.zoom + cam.y - canvas.height / 2 / cam.zoom);
      document.getElementById('status-pos').textContent = `${x}, ${y}`;
    }

    function updateStatus() {
      const cam = editor.getCamera();
      document.getElementById('status-mode').textContent = editor.getMode() === EDITOR_MODES.EDIT ? '编辑' : '试玩';
      document.getElementById('status-zoom').textContent = Math.round(cam.zoom * 100) + '%';
      const b = editor.getBuildings();
      const n = editor.getNPCs();
      const s = editor.getSpawners();
      const w = editor.getWaypoints();
      document.getElementById('status-count').textContent = `建筑: ${b.length} | NPC: ${n.length} | 生成器: ${s.length} | 路点: ${w.length}`;
    }

    function getToolName(tool) {
      const names = {
        select: '选择', terrain: '地形笔刷', biome: '群系笔刷',
        building: '建筑', npc: 'NPC', spawner: '生成器',
        waypoint: '路点', region: '区域', eraser: '橡皮擦'
      };
      return names[tool] || tool;
    }

    function updatePalette(tool) {
      const presets = editor.getPresets();
      let items = [];
      let title = '';

      switch (tool) {
        case EDITOR_TOOLS.BUILDING:
          items = presets.building;
          title = '建筑预设';
          break;
        case EDITOR_TOOLS.NPC:
          items = presets.npc;
          title = 'NPC预设';
          break;
        case EDITOR_TOOLS.TERRAIN:
        case EDITOR_TOOLS.BIOME:
          items = presets.terrain;
          title = '地形预设';
          break;
        default:
          palette.classList.remove('visible');
          return;
      }

      paletteTitle.textContent = title;
      paletteContent.innerHTML = items.map((item, i) => `
        <div class="palette-item" data-index="${i}">${item.name}</div>
      `).join('');

      paletteContent.querySelectorAll('.palette-item').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.index);
          if (tool === EDITOR_TOOLS.BUILDING) editor.setBuildingPreset(items[idx].name);
          else if (tool === EDITOR_TOOLS.NPC) editor.setNPCPreset(items[idx].name);
          paletteContent.querySelectorAll('.palette-item').forEach(e => e.classList.remove('selected'));
          el.classList.add('selected');
        });
      });

      palette.classList.add('visible');
    }

    // Render loop
    function renderLoop() {
      editor.render(renderer.ctx);
      requestAnimationFrame(renderLoop);
    }

    // Handle resize
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      renderer.resize(window.innerWidth, window.innerHeight);
    });

    // Initial resize
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    renderer.resize(window.innerWidth, window.innerHeight);

    // Start render loop
    renderLoop();
    updateStatus();

    // Check for playtest data
    const params = new URLSearchParams(window.location.search);
    if (params.has('playtest')) {
      const data = localStorage.getItem('legendeditor.playtest');
      if (data) {
        try {
          editor.deserialize(JSON.parse(data));
          editor.togglePlaytest();
        } catch (e) { console.error('Failed to load playtest data', e); }
      }
    }
  </script>
</body>
</html>
