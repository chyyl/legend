# Netlify Configuration for Project Emancipate
# Static deployment from root directory

[build]
  # No build command needed - pure static files
  command = "echo 'No build step required'"
  publish = "."

[[headers]]
  # ES Modules need proper MIME types
  for = "/js/**"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  # SPA fallback (not needed for this game but good practice)
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}

[[redirects]]
  # Editor route
  from = "/editor"
  to = "/editor.html"
  status = 301

[[redirects]]
  from = "/editor/"
  to = "/editor.html"
  status = 301

# GitHub Pages compatible settings
[functions]
  node_bundler = "esbuild"
  included_files = []
  excluded_files = []

[dev]
  command = "python serve_dev.py 8091"
  port = 8091
  publish = "."