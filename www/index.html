<!DOCTYPE html>
<!--
  ============================================================================
  index.html —— LEGEND 游戏总入口
  ----------------------------------------------------------------------------
  本文件职责：
    1) 作为纯 HTML5 + Canvas 单页应用的宿主页（可被 Capacitor 打包为 APK/iOS/EXE）
    2) 按依赖顺序加载所有 JS 模块（无框架、无 ES-module，确保 file:// 离线可运行）
    3) 提供 Canvas 舞台与加载遮罩

  依赖顺序（下述脚本彼此通过 window.LG 命名空间通信，互不直接引用内部实现）：
    data/i18n -> data/holiday -> core/config -> core/utils -> core/assets -> core/input
    -> audio/audio -> world/terrain -> world/pathfinding -> world/camera -> world/decor
    -> game/loot -> game/inventory -> game/player -> game/enemy
    -> game/combat -> game/quest -> game/npc -> game/save -> game/ui
    -> net/net -> net/lobby -> core/engine -> core/updater -> main
    另有生成文件 js/generated/changelog.js（tools/build-www.mjs 从 CHANGELOG.md 生成，
    提供 LG.CHANGELOG 数据；缺失时游戏内更新日志页显示"暂无"，不影响其余功能）

  接口文档：docs/api.md
  修改守则：新增功能请新建文件并在本注释区登记，勿改动其他文件内部实现。
  ============================================================================
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 移动端适配：禁止缩放页面（游戏内缩放由 Canvas 自行处理），适配 iPhone12 刘海 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>LEGEND 传奇</title>
  <!-- 内联空图标，避免 favicon.ico 404 请求 -->
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/style.css?v=71beafb0" />
</head>
<body>
  <!-- 游戏主画布：所有像素画面均绘制于此 -->
  <canvas id="game"></canvas>

  <!-- HTML 覆盖层：菜单/对话框/输入框等用 DOM 实现，便于聚焦与无障碍点击 -->
  <div id="overlay"></div>

  <!-- 加载遮罩：资源与字体就绪前显示 -->
  <div id="boot">
    <div class="boot-inner">
      <div class="boot-title">LEGEND</div>
      <div class="boot-sub">正在载入传奇世界…</div>
      <div class="boot-bar"><div id="boot-fill"></div></div>
    </div>
  </div>

  <!-- ===== 生成层（tools/build-www.mjs 从 CHANGELOG.md 生成，勿手改） ===== -->
  <script src="js/generated/changelog.js?v=71beafb0"></script>
  <!-- ===== 核心层 ===== -->
  <script src="js/data/i18n.js?v=71beafb0"></script>
  <script src="js/data/holiday.js?v=71beafb0"></script>
  <script src="js/core/config.js?v=71beafb0"></script>
  <script src="js/core/utils.js?v=71beafb0"></script>
  <script src="js/core/assets.js?v=71beafb0"></script>
  <script src="js/core/input.js?v=71beafb0"></script>
  <script src="js/audio/audio.js?v=71beafb0"></script>
  <!-- ===== 世界层 ===== -->
  <script src="js/world/terrain.js?v=71beafb0"></script>
  <script src="js/world/pathfinding.js?v=71beafb0"></script>
  <script src="js/world/camera.js?v=71beafb0"></script>
  <script src="js/world/decor.js?v=71beafb0"></script>
  <!-- ===== 玩法层 ===== -->
  <script src="js/game/loot.js?v=71beafb0"></script>
  <script src="js/game/inventory.js?v=71beafb0"></script>
  <script src="js/game/player.js?v=71beafb0"></script>
  <script src="js/game/enemy.js?v=71beafb0"></script>
  <script src="js/game/combat.js?v=71beafb0"></script>
  <script src="js/game/quest.js?v=71beafb0"></script>
  <script src="js/game/npc.js?v=71beafb0"></script>
  <script src="js/game/save.js?v=71beafb0"></script>
  <script src="js/game/ui.js?v=71beafb0"></script>
  <!-- ===== 联机层 ===== -->
  <script src="js/net/net.js?v=71beafb0"></script>
  <script src="js/net/lobby.js?v=71beafb0"></script>
  <!-- ===== 引导层 ===== -->
  <script src="js/core/engine.js?v=71beafb0"></script>
  <script src="js/core/updater.js?v=71beafb0"></script>
  <script src="js/main.js?v=71beafb0"></script>
</body>
</html>
