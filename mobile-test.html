<!DOCTYPE html>
<!-- 临时调试页：手机视口内嵌游戏，供浏览器工具做移动端诊断。
     可加参数指定尺寸：mobile-test.html?w=844&h=390（横屏） 用完可删 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>mobile test harness</title>
<style>
  body { margin: 0; background: #444; }
  iframe { border: 0; display: block; background: #000; }
</style>
</head>
<body>
<iframe id="m"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var f = document.getElementById('m');
  f.style.width = (q.get('w') || 390) + 'px';
  f.style.height = (q.get('h') || 844) + 'px';
  f.src = 'index.html?v=5';
</script>
</body>
</html>
