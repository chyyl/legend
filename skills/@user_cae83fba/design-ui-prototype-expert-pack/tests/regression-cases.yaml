version: 1.2.0
name: design-ui-prototype-expert-pack-regression
description: 12 条机器可读的路由与输出回归用例，覆盖 8 类输入场景与 8 类能力。执行记录填入 tests/result-template.md，发布判定见 qa/release-gate.md。
resultTemplate: tests/result-template.md
gateDoc: qa/release-gate.md
promptDoc: qa/prompt-regression-set.md

cases:
  - id: R1
    name: 一句话想法转产品结构
    input: 我想做一个给运营团队看的客户跟进质量看板，帮我整理成可评审的产品结构，不要直接开始画 UI。
    inputType: 一句话
    expectedRoute: "01"
    requiredOutputs:
      - 目标与非目标
      - 用户与场景
      - 页面清单且每项有存在理由
      - 主路径与异常状态
      - 假设与待确认问题且标注来源
    passCriteria: 未直接跳到视觉层，假设已标注来源，影响范围已写明
    covers:
      - 门禁触发
      - 假设标注
      - 路由不越界

  - id: R2
    name: 预约 PRD 转流程与线框
    input: 下面是一段预约预订 PRD，请提取页面清单、主路径和每个页面的线框图规格。请覆盖空状态、加载状态和错误状态。
    inputType: PRD
    expectedRoute: "01->02"
    requiredOutputs:
      - 页面清单含存在理由
      - 主路径
      - 区块结构与顺序
      - 主要操作恰好一个
      - 五种必备状态
    passCriteria: 每页有目标，关键状态齐备，页面顺序符合用户决策顺序
    covers:
      - 页面清单门禁
      - 状态覆盖
      - 跨段上下文传递

  - id: R3
    name: B2B 线框转 UI 规格
    input: 这是一个 B2B 后台的低保真线框图说明，请生成 UI 规格。请给出字体、颜色、间距、组件状态和可读性建议。
    inputType: 线框描述
    expectedRoute: "03"
    requiredOutputs:
      - 视觉方向及理由
      - 字体层级不少于五级
      - 颜色语义
      - 间距 token 不少于六个
      - 组件状态
      - 参数建议段
    passCriteria: 回答含具体数值，不是泛化形容词
    covers:
      - 参数化建议
      - 行业声明
      - 对比度门槛

  - id: R4
    name: 三个 UI 页面转设计系统
    input: 我有三个 UI 页面，请帮我提炼成一个临时设计系统，包含 token、组件清单、组件状态和使用边界。
    inputType: UI 页面
    expectedRoute: "04"
    requiredOutputs:
      - 原始值 token
      - 语义 token 含 usage 与 forbiddenUsage
      - 组件 token
      - 组件状态矩阵
      - 不可复用清单
      - 前端映射建议
    passCriteria: 语义 token 占比不低于 80%，组件覆盖七态
    covers:
      - token 三层映射
      - 复用边界判定
      - 状态矩阵填充

  - id: R5
    name: HTML 原型 QA 评审
    input: 请评审这个 HTML 原型是否可以进入评审。请给出通过、带风险通过或不通过的结论，并列出 P0 至 P3 问题。
    inputType: HTML
    expectedRoute: "06"
    requiredOutputs:
      - 三选一结论
      - P0 至 P3 问题清单
      - 证据位置
      - 影响与修复建议
      - 七维评分与扣分依据
    passCriteria: 无证据时不给通过类结论，文件打不开时明确说明缺运行时检查
    covers:
      - 三输入对齐
      - 证据化结论
      - 评分可复评

  - id: R6
    name: 金融类后台 UI 规格
    input: 这是金融后台的线框图，请给 UI 规格和参数建议。
    inputType: 线框加行业
    expectedRoute: "03"
    requiredOutputs:
      - 参数建议段
      - 金融行业反模式逐条对照
      - 命中项的调整后取值
    passCriteria: 金融反模式逐条给出结论
    covers:
      - 行业反模式过滤
      - 参数化建议

  - id: R7
    name: 医疗类产品 UI 规格
    input: 这是医疗类产品后台的线框图，请给 UI 规格和参数建议。
    inputType: 线框加行业
    expectedRoute: "03"
    requiredOutputs:
      - 参数建议段
      - 医疗行业反模式逐条对照
      - 命中项的调整后取值
    passCriteria: 医疗反模式逐条给出结论
    covers:
      - 行业反模式过滤
      - 参数化建议

  - id: R8
    name: 含确认表的原型评审
    input: 下面有需求确认表和对应的 HTML 原型，请对照需求评审实现情况。
    inputType: 确认表加 HTML
    expectedRoute: "06"
    requiredOutputs:
      - 需求覆盖矩阵
      - 每条需求有实现状态
      - 每条需求有证据位置
      - 未能验证项列入 uncovered
    passCriteria: 需求条目覆盖率 100%，无整体打勾式结论
    covers:
      - 需求覆盖矩阵
      - 三输入对齐
      - 差异记录

  - id: R9
    name: 窄屏与放大字号弹性检查
    input: 请检查这个原型在窄屏和字号放大到 200% 时的表现。
    inputType: HTML
    expectedRoute: "05或06"
    requiredOutputs:
      - 弹性文本六条逐条落地方式
      - 四档断点布局变化
      - 主路径是否仍可完成
    passCriteria: 六条各有方式，不写笼统的自适应
    covers:
      - 弹性文本六条
      - 响应式断点表

  - id: R10
    name: 信息不足时的降级交付
    input: 只有这张截图，你先看看能做什么。
    inputType: 截图
    expectedRoute: "01"
    requiredOutputs:
      - 分诊结论
      - 信息缺口清单
      - 需补充材料清单
      - 可继续推进的最低版本
    passCriteria: 走降级出口，未强行输出完整页面清单
    covers:
      - 分诊规则
      - 降级规则
      - 门禁阻断

  - id: R11
    name: 只要设计系统不要原型
    input: 我只要一套设计系统规范，不需要原型，也不需要交接文档。
    inputType: 一句话
    expectedRoute: "04"
    requiredOutputs:
      - 设计系统产物
      - 跳过下游阶段的理由
    passCriteria: 路由未越界到 05 与 06，并说明可跳过条件
    covers:
      - 路由不越界
      - 阶段可跳过判断

  - id: R12
    name: 已有 DESIGN.md 落地页面
    input: 我们有品牌设计规范文档，请据此把页面落成 UI 规格与前端交接说明。
    inputType: 品牌样本
    expectedRoute: "03到05"
    requiredOutputs:
      - 品牌样本取用说明与路径
      - UI 规格
      - 前端交接清单
    passCriteria: 品牌样本路径可达且有效，规范规则被正确引用，未声称已覆盖全部规范
    covers:
      - 品牌样本取用路径
      - 路径回归
      - 规范引用
