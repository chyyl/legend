name: CI / Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run syntax check
        run: |
          for f in js/main.js js/engine/*.js js/gameplay/*.js js/ui/*.js js/editor/*.js; do
            node --check "$f" || exit 1
          done
          echo "✅ All JS files pass syntax check"

  smoke-tests:
    name: Smoke Tests (Node)
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run world smoke test
        run: node tests/smoke_world.mjs

      - name: Run quest smoke test
        run: node tests/smoke_quest.mjs

      - name: Run loot smoke test
        run: node tests/smoke_loot.mjs

      - name: Summary
        run: echo "✅ All smoke tests passed"

  e2e-tests:
    name: Playwright E2E (33 assertions)
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          python serve_dev.py 8091 &
          sleep 5
          curl -f http://localhost:8091/index.html || exit 1

      - name: Run E2E tests
        run: npx playwright test --reporter=line

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [syntax-check, smoke-tests, e2e-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: syntax-check
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        run: |
          python build_apk.py

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: legend-apk
          path: apk/dist/legend.apk
          retention-days: 30

      - name: Create Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: apk/dist/legend.apk
          generate_release_notes: true

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [syntax-check, smoke-tests, e2e-tests, deploy-pages]
    if: always()
    steps:
      - name: Status
        run: |
          if [[ "${{ needs.syntax-check.result }}" == "success" &&
                "${{ needs.smoke-tests.result }}" == "success" &&
                "${{ needs.e2e-tests.result }}" == "success" &&
                "${{ needs.deploy-pages.result }}" == "success" ]]; then
            echo "✅ All checks passed - deployed to GitHub Pages"
          else
            echo "❌ Some checks failed"
            exit 1
          fi