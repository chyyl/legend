# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# 构建专用 JDK（打包章节）：AGP 8.x 的 JdkImageTransform（jlink 重建 java.base 系统镜像）
# 与系统 JDK 26 不兼容——已知 bug「JdkImageTransform failure with JDK 26」
# （Google Issue #486844145，AGP 9.2.0 才修复），故 Gradle 构建 JVM 单独指向本地解压的
# Temurin 21（仅构建用，不写入系统 PATH/JAVA_HOME；zip 来源清华 TUNA Adoptium 镜像）。
# 若更换机器/目录，改此路径即可，正斜杠写法（反斜杠会被 Properties 转义吞掉）。
org.gradle.java.home=C:/Users/L1896/tools/jdk21/jdk-21.0.12.1+1
